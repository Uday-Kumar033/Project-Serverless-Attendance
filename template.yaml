AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Serverless Attendance Management System

Parameters:
  Stage:
    Type: String
    Default: dev
  JwtSecret:
    Type: String
    NoEcho: true
    MinLength: 32
    Description: Long random string used to sign JWTs
  AllowedOrigin:
    Type: String
    Default: http://localhost:5173
    Description: Frontend origin for CORS (use CloudFront URL in prod)

Globals:
  Function:
    Runtime: python3.12
    Timeout: 10
    MemorySize: 256
    Environment:
      Variables:
        USERS_TABLE: !Ref UsersTable
        ATTENDANCE_TABLE: !Ref AttendanceTable
        CLASSES_TABLE: !Ref ClassesTable
        OTP_TABLE: !Ref OtpTable
        JWT_SECRET: !Ref JwtSecret
        ALLOWED_ORIGIN: !Ref AllowedOrigin

Resources:
  HttpApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      StageName: !Ref Stage
      CorsConfiguration:
        AllowOrigins: [!Ref AllowedOrigin]
        AllowMethods: [GET, POST, PUT, OPTIONS]
        AllowHeaders: [Content-Type, Authorization]
      DefaultRouteSettings:
        ThrottlingBurstLimit: 20
        ThrottlingRateLimit: 10

  # ---------- Functions ----------
  HealthFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: backend/
      Handler: functions.health.handler.lambda_handler
      Events:
        Health:
          Type: HttpApi
          Properties: {ApiId: !Ref HttpApi, Path: /health, Method: GET}

  AuthFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: backend/
      Handler: functions.auth.handler.lambda_handler
      Policies:
        - DynamoDBCrudPolicy: {TableName: !Ref UsersTable}
        - DynamoDBCrudPolicy: {TableName: !Ref OtpTable}
        - Statement:
            - Effect: Allow
              Action: sns:Publish
              Resource: '*'
      Events:
        Register: {Type: HttpApi, Properties: {ApiId: !Ref HttpApi, Path: /auth/register, Method: POST}}
        Login: {Type: HttpApi, Properties: {ApiId: !Ref HttpApi, Path: /auth/login, Method: POST}}
        Forgot: {Type: HttpApi, Properties: {ApiId: !Ref HttpApi, Path: /auth/forgot, Method: POST}}
        Reset: {Type: HttpApi, Properties: {ApiId: !Ref HttpApi, Path: /auth/reset, Method: POST}}

  AttendanceFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: backend/
      Handler: functions.attendance.handler.lambda_handler
      Policies:
        - DynamoDBCrudPolicy: {TableName: !Ref AttendanceTable}
        - DynamoDBCrudPolicy: {TableName: !Ref ClassesTable}
        - DynamoDBReadPolicy: {TableName: !Ref UsersTable}
      Events:
        Mine: {Type: HttpApi, Properties: {ApiId: !Ref HttpApi, Path: /attendance/me, Method: GET}}
        Mark: {Type: HttpApi, Properties: {ApiId: !Ref HttpApi, Path: /attendance, Method: POST}}
        List: {Type: HttpApi, Properties: {ApiId: !Ref HttpApi, Path: /attendance, Method: GET}}

  # ---------- Tables (provisioned 2/2 so total stays under the 25 RCU/WCU always-free tier) ----------
  UsersTable:
    Type: AWS::DynamoDB::Table
    Properties:
      AttributeDefinitions:
        - {AttributeName: userId, AttributeType: S}
        - {AttributeName: email, AttributeType: S}
        - {AttributeName: username, AttributeType: S}
      KeySchema: [{AttributeName: userId, KeyType: HASH}]
      ProvisionedThroughput: {ReadCapacityUnits: 2, WriteCapacityUnits: 2}
      GlobalSecondaryIndexes:
        - IndexName: email-index
          KeySchema: [{AttributeName: email, KeyType: HASH}]
          Projection: {ProjectionType: ALL}
          ProvisionedThroughput: {ReadCapacityUnits: 2, WriteCapacityUnits: 2}
        - IndexName: username-index
          KeySchema: [{AttributeName: username, KeyType: HASH}]
          Projection: {ProjectionType: ALL}
          ProvisionedThroughput: {ReadCapacityUnits: 2, WriteCapacityUnits: 2}
      PointInTimeRecoverySpecification: {PointInTimeRecoveryEnabled: true}

  AttendanceTable:
    Type: AWS::DynamoDB::Table
    Properties:
      AttributeDefinitions:
        - {AttributeName: studentId, AttributeType: S}
        - {AttributeName: sk, AttributeType: S}
        - {AttributeName: classId, AttributeType: S}
        - {AttributeName: date, AttributeType: S}
      KeySchema:
        - {AttributeName: studentId, KeyType: HASH}
        - {AttributeName: sk, KeyType: RANGE}
      ProvisionedThroughput: {ReadCapacityUnits: 2, WriteCapacityUnits: 2}
      GlobalSecondaryIndexes:
        - IndexName: class-date-index
          KeySchema:
            - {AttributeName: classId, KeyType: HASH}
            - {AttributeName: date, KeyType: RANGE}
          Projection: {ProjectionType: ALL}
          ProvisionedThroughput: {ReadCapacityUnits: 2, WriteCapacityUnits: 2}

  ClassesTable:
    Type: AWS::DynamoDB::Table
    Properties:
      AttributeDefinitions: [{AttributeName: classId, AttributeType: S}]
      KeySchema: [{AttributeName: classId, KeyType: HASH}]
      ProvisionedThroughput: {ReadCapacityUnits: 2, WriteCapacityUnits: 2}

  OtpTable:
    Type: AWS::DynamoDB::Table
    Properties:
      AttributeDefinitions: [{AttributeName: phone, AttributeType: S}]
      KeySchema: [{AttributeName: phone, KeyType: HASH}]
      ProvisionedThroughput: {ReadCapacityUnits: 2, WriteCapacityUnits: 2}
      TimeToLiveSpecification: {AttributeName: expiresAt, Enabled: true}

Outputs:
  ApiUrl:
    Value: !Sub 'https://${HttpApi}.execute-api.${AWS::Region}.amazonaws.com/${Stage}'
