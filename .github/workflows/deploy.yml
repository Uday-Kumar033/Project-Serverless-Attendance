name: Deploy

# Every push to main (for example a merged pull request) is tested, then deployed to AWS.
on:
  push:
    branches: [main]
  workflow_dispatch:

# Never run two deployments at once; a second one waits for the first.
concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  test:
    uses: ./.github/workflows/ci.yml

  deploy:
    name: Deploy to AWS
    needs: test
    runs-on: ubuntu-latest
    permissions:
      id-token: write   # lets GitHub prove its identity to AWS (no stored keys)
      contents: read
    env:
      STATE_REGION: ${{ vars.AWS_REGION }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.10.5
          terraform_wrapper: false
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - name: Deploy backend, infrastructure and frontend
        run: bash scripts/deploy.sh -auto-approve
